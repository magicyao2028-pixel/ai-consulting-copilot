[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-consulting-copilot"
version = "0.3.0"
description = "Offline interview-governance and evidence-backed decision workflow for small-business AI pilots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
consulting-copilot = "consulting_copilot.cli:main"
consulting-interview-normalize = "consulting_copilot.interview_cli:normalize_main"
consulting-claim-review = "consulting_copilot.interview_cli:review_main"

[tool.setuptools.packages.find]
where = ["src"]
