[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-consulting-copilot"
version = "0.2.0"
description = "Offline evidence-backed decision memo workflow for small-business AI pilots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
consulting-copilot = "consulting_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
